<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Macro Recorder 5.9.0 KeyGen</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>

    <div class="container">
        <h1>Macro Recorder 5.9.0 KeyGen</h1>
        <p class="subtitle">by TH3C0D3R</p>
        <div class="input-section">
            <input type="text" id="username" placeholder="Enter Username">
            <button id="generate" onclick="generateKey()">Generate Serial</button>
        </div>
        <div class="output-section">
            <p id="status">Enter a username to start...</p>
            <textarea id="serialOutput" readonly></textarea>
            <button id="copyBtn" onclick="copySerial()">Copy to Clipboard</button>
        </div>
    </div>

    <script src="./js/serial.js"></script>
    <script src="./js/app.js"></script>
</body>

</html>
